[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-llm-router"
version = "0.1.0"
description = "A standalone Python SDK for routing chat-completion requests to LLM providers and gateways."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "litellm",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_llm_router*"]

[tool.setuptools.package-data]
ai_llm_router = ["py.typed"]
